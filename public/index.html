<style>
/* Layout: phone-first shop column (max 1080px), sticky header, bottom tab bar, bottom sheets for buy/login/pay */
:root{
  --bg:#F3F5EE; --surface:#FFFFFF; --sunk:#E8ECE1; --ink:#1C261F; --muted:#5E6B60; --line:#D5DCCD;
  --green:#1F5A3E; --green-ink:#FFFFFF; --brass:#A87A24; --brass-soft:#F4E7C8; --saffron:#D9731F;
  --ok:#2E7D4F; --warn:#B26A00; --bad:#B3261E; --shadow:0 10px 30px rgba(28,38,31,.14);
  --display:"Marcellus","Palatino Linotype",Palatino,Georgia,serif;
  --body:"Mukta","Segoe UI",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121814; --surface:#1A221D; --sunk:#232D26; --ink:#E9EEE6; --muted:#9CAA9F; --line:#2F3B33;
  --green:#5DBB8A; --green-ink:#0E1A13; --brass:#D9AE5C; --brass-soft:#3A3020; --saffron:#F0954A;
  --ok:#6CCB93; --warn:#E8A646; --bad:#F2867E; --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121814; --surface:#1A221D; --sunk:#232D26; --ink:#E9EEE6; --muted:#9CAA9F; --line:#2F3B33;
  --green:#5DBB8A; --green-ink:#0E1A13; --brass:#D9AE5C; --brass-soft:#3A3020; --saffron:#F0954A;
  --ok:#6CCB93; --warn:#E8A646; --bad:#F2867E; --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;padding-bottom:84px}
h1,h2,h3{font-family:var(--display);font-weight:400;text-wrap:balance;margin:0}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:1080px;margin:0 auto;padding-inline:16px}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-block:10px}
.mark{width:38px;height:38px;border-radius:50%;background:var(--green);color:var(--green-ink);display:grid;place-items:center;font-family:var(--display);font-size:20px;flex:none}
.brand{min-width:0;flex:1}
.brand b{display:block;font-family:var(--display);font-weight:400;font-size:19px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;color:var(--muted);font-size:12px;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who{font-size:13px;color:var(--muted);text-align:right;flex:none;max-width:40%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seg{display:flex;background:var(--sunk);border-radius:999px;padding:4px;gap:4px;margin-block:4px 10px}
.seg button{flex:1;border:0;background:transparent;border-radius:999px;padding:8px 10px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}

/* hero strip */
.festive{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;background:var(--green);color:var(--green-ink);border-radius:16px;padding:16px 18px;margin-block:16px}
.festive h2{font-size:22px}
.festive p{margin:4px 0 0;opacity:.9;font-size:14.5px}
.count{text-align:center;border:1px solid currentColor;border-radius:12px;padding:6px 12px;opacity:.95}
.count b{display:block;font-family:var(--display);font-size:28px;line-height:1}
.count span{font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.promise{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.promise span{font-size:13px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 10px;color:var(--muted)}
.promise b{color:var(--ink);font-weight:600}

.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:8px;scrollbar-width:none}
.chips button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:14.5px}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* product grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
@media (min-width:700px){.grid{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;text-align:left;padding:0}
.card .pic{aspect-ratio:1/1;max-width:100%;background:var(--sunk);position:relative}
.card .pic img,.card .pic svg{width:100%;height:100%;object-fit:cover;display:block}
.tag{position:absolute;left:8px;top:8px;background:var(--brass-soft);color:var(--ink);font-size:11.5px;font-weight:600;border-radius:6px;padding:2px 7px;letter-spacing:.03em}
.card .body{padding:10px 12px 12px;display:flex;flex-direction:column;gap:2px;flex:1}
.card .name{font-weight:600;line-height:1.25}
.card .pack{color:var(--muted);font-size:13.5px}
.price{display:flex;align-items:baseline;gap:6px;margin-top:auto;padding-top:6px}
.price b{font-size:18px}
.price s{color:var(--muted);font-size:13px}
.price em{font-style:normal;color:var(--ok);font-size:13px;font-weight:600}
.empty{padding:40px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px}

/* corporate */
.corp-hero{display:grid;gap:14px;margin-block:16px}
@media (min-width:760px){.corp-hero{grid-template-columns:1.2fr 1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px}
.panel h2{font-size:22px;margin-bottom:6px}
.panel p{margin:0 0 10px;color:var(--muted)}
.tiers{width:100%;border-collapse:collapse;font-size:15px}
.tiers td,.tiers th{padding:8px 4px;border-bottom:1px solid var(--line);text-align:left}
.tiers th{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600}
.perks{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.perks li{display:grid;grid-template-columns:22px 1fr;gap:8px;align-items:start}
.perks li::before{content:"";width:10px;height:10px;margin-top:7px;border-radius:2px;background:var(--brass);transform:rotate(45deg)}
.section-h{display:flex;justify-content:space-between;align-items:baseline;margin:22px 0 10px;gap:12px}
.section-h h2{font-size:22px}
.section-h span{color:var(--muted);font-size:14px}

/* buttons & forms */
.btn{border:0;border-radius:12px;padding:12px 18px;font-weight:600;background:var(--green);color:var(--green-ink);display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn.block{width:100%}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.brass{background:var(--brass);color:#fff}
.btn.small{padding:7px 12px;font-size:14px;border-radius:10px}
.btn:disabled{opacity:.5;cursor:not-allowed}
label.f{display:grid;gap:4px;font-size:14px;font-weight:500}
label.f span.hint{font-weight:400;color:var(--muted);font-size:12.5px}
input,textarea,select{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;font-size:16px}
textarea{resize:vertical;min-height:70px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form{display:grid;gap:12px}
.err{color:var(--bad);font-size:13.5px;min-height:1em}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14.5px}
.check input{width:20px;height:20px;flex:none;margin-top:2px}

/* sheets */
.scrim{position:fixed;inset:0;background:rgba(10,15,12,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92vh;overflow-y:auto;border-radius:20px 20px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom,0px));box-shadow:var(--shadow);animation:up .22s ease-out}
@media (min-width:700px){.scrim{align-items:center}.sheet{border-radius:20px}}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.sheet-h{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}
.sheet-h h3{font-size:22px}
.x{border:0;background:var(--sunk);width:34px;height:34px;border-radius:50%;font-size:18px;flex:none}
.pd-pic{border-radius:14px;overflow:hidden;aspect-ratio:4/3;max-width:100%;background:var(--sunk);margin-bottom:12px}
.pd-pic img,.pd-pic svg{width:100%;height:100%;object-fit:cover;display:block}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.facts div{background:var(--sunk);border-radius:10px;padding:8px}
.facts small{display:block;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.facts b{font-weight:600;font-size:14px}
.qty{display:flex;align-items:center;gap:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;width:max-content}
.qty button{border:0;background:var(--sunk);width:44px;height:44px;font-size:20px}
.qty input{width:64px;border:0;border-radius:0;text-align:center;background:var(--surface);height:44px}
.buybar{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:14px}
.note{font-size:13.5px;color:var(--muted)}
.tierhint{background:var(--brass-soft);border-radius:10px;padding:8px 10px;font-size:14px;margin-top:10px}

/* order popup */
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:15px;margin:0}
.kv dt{color:var(--muted)}
.kv dd{margin:0;text-align:right;min-width:0;overflow-wrap:anywhere}
.lines{border-top:1px dashed var(--line);border-bottom:1px dashed var(--line);margin:12px 0;padding:10px 0;display:grid;gap:6px}
.line{display:flex;justify-content:space-between;gap:10px}
.total{font-size:20px;font-weight:700}
.payapps{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:8px}
.payapps span{font-size:12px;border:1px solid var(--line);border-radius:6px;padding:2px 8px;color:var(--muted)}
.qrbox{display:grid;place-items:center;gap:6px;background:#fff;border-radius:12px;padding:14px;margin:12px auto;width:max-content;max-width:100%}
.qrbox small{color:#333}
.upi-id{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;font-size:15px}
.upi-id code{background:var(--sunk);padding:4px 8px;border-radius:6px;user-select:all}

/* receipt */
.receipt{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;margin-block:16px;position:relative;overflow:hidden}
.receipt::before{content:"";position:absolute;left:0;right:0;top:0;height:6px;background:repeating-linear-gradient(90deg,var(--brass) 0 14px,var(--green) 14px 28px)}
.stamp{display:inline-block;border:2px solid var(--ok);color:var(--ok);border-radius:8px;padding:2px 10px;font-weight:700;letter-spacing:.08em;font-size:13px;transform:rotate(-3deg)}
.stamp.pending{border-color:var(--warn);color:var(--warn)}
.eta{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;background:var(--sunk);border-radius:12px;padding:12px 14px;margin:14px 0}
.eta b{font-family:var(--display);font-size:24px;font-weight:400}
.track{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:0}
.track li{display:grid;grid-template-columns:20px 1fr;gap:10px;padding-bottom:12px;position:relative;color:var(--muted)}
.track li::before{content:"";width:12px;height:12px;border-radius:50%;border:2px solid var(--line);background:var(--surface);margin-top:5px;z-index:1}
.track li::after{content:"";position:absolute;left:6px;top:18px;bottom:-2px;width:2px;background:var(--line)}
.track li:last-child::after{display:none}
.track li.done{color:var(--ink)}
.track li.done::before{background:var(--ok);border-color:var(--ok)}

/* orders list, admin */
.list{display:grid;gap:10px}
.oitem{display:grid;grid-template-columns:1fr auto;gap:4px 12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;text-align:left;width:100%}
.oitem small{color:var(--muted);grid-column:1/-1}
.pill{font-size:12px;font-weight:600;border-radius:999px;padding:2px 9px;background:var(--sunk);justify-self:end;align-self:start}
.pill.ok{color:var(--ok)} .pill.warn{color:var(--warn)} .pill.info{color:var(--brass)}
.admin-row{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.admin-row .thumb{width:56px;height:56px;border-radius:8px;overflow:hidden;background:var(--sunk)}
.admin-row .thumb img,.admin-row .thumb svg{width:100%;height:100%;object-fit:cover;display:block}
.admin-row .meta{min-width:0}
.admin-row .meta b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.admin-row .meta small{color:var(--muted)}
.tabs2{display:flex;gap:6px;margin:14px 0;flex-wrap:wrap}
.tabs2 button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 12px}
.tabs2 button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.photo-in{display:grid;grid-template-columns:96px 1fr;gap:12px;align-items:center}
.photo-in .prev{width:96px;height:96px;border-radius:10px;overflow:hidden;background:var(--sunk)}
.photo-in .prev img,.photo-in .prev svg{width:100%;height:100%;object-fit:cover;display:block}

/* bottom nav */
nav.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabbar .wrap{display:grid;grid-template-columns:repeat(4,1fr)}
nav.tabbar button{border:0;background:none;padding:8px 4px 10px;display:grid;justify-items:center;gap:2px;font-size:12.5px;color:var(--muted)}
nav.tabbar button svg{width:22px;height:22px}
nav.tabbar button[aria-current="page"]{color:var(--green);font-weight:600}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:80;font-size:14.5px;max-width:calc(100% - 32px)}
.demo{font-size:12.5px;color:var(--muted);text-align:center;margin:24px 0 8px}
</style>

<header class="top">
  <div class="wrap">
    <div class="mark" aria-hidden="true">श्री</div>
    <div class="brand"><b>Shree Ram Trading Co.</b><small>Dry fruits · Gifting · Corporate</small></div>
    <div class="who" id="who"></div>

<main class="wrap" id="app"></main>

    <button data-nav="corporate"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5h6v2M3 12h18"/></svg>Corporate</button>

    <button data-nav="account"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>Account</button>
  </div>
</nav>

<script>
/* ---------- storage (falls back to memory) ---------- */
const mem = {};
const store = {
  get(k, d){ try{ const v = localStorage.getItem('srt_'+k); return v ? JSON.parse(v) : (mem[k] ?? d); }catch(e){ return mem[k] ?? d; } },
  set(k, v){ mem[k] = v; try{ localStorage.setItem('srt_'+k, JSON.stringify(v)); }catch(e){} }
};

/* ---------- seed data (examples for the owner to replace) ---------- */
const today = new Date();
const daysAgo = n => { const d = new Date(today); d.setDate(d.getDate()-n); return d.toISOString().slice(0,10); };
const SEED = [
  {id:'p1',name:'California Almonds',cat:'Dry fruits',section:'both',price:549,mrp:649,pack:'500 g',origin:'California',art:'almond',stock:120,packedOn:daysAgo(3),brief:'Crunchy, sweet, uniform-size almonds. Sorted by hand and vacuum-sealed in our godown.'},
  {id:'p2',name:'Cashew W240',cat:'Dry fruits',section:'both',price:629,mrp:720,pack:'500 g',origin:'Goa',art:'cashew',stock:90,packedOn:daysAgo(2),brief:'Large whole W240 cashews from Goa. Creamy bite, no broken pieces.'},
  {id:'p3',name:'Iranian Pistachios, Salted',cat:'Dry fruits',section:'both',price:449,mrp:520,pack:'250 g',origin:'Iran',art:'pista',stock:60,packedOn:daysAgo(5),brief:'Roasted and lightly salted, naturally opened shells.'},
  {id:'p4',name:'Kashmiri Walnut Kernels',cat:'Dry fruits',section:'individual',price:399,mrp:460,pack:'250 g',origin:'Kashmir',art:'walnut',stock:45,packedOn:daysAgo(4),brief:'Light-coloured halves, fresh this season. Store in the fridge after opening.'},
  {id:'p5',name:'Afghani Black Raisins',cat:'Dry fruits',section:'individual',price:279,mrp:320,pack:'500 g',origin:'Afghanistan',art:'raisin',stock:80,packedOn:daysAgo(6),brief:'Seedless, plump black raisins. Good for soaking overnight.'},
  {id:'p6',name:'Medjool Dates',cat:'Dry fruits',section:'individual',price:699,mrp:799,pack:'500 g',origin:'Jordan',art:'date',stock:40,packedOn:daysAgo(2),brief:'Soft, caramel-sweet jumbo dates.'},
  {id:'p7',name:'Diwali Brass Thali Hamper',cat:'Festive hampers',section:'both',price:1899,mrp:2299,pack:'4 × 200 g + diya',origin:'Assorted',art:'hamper',stock:35,packedOn:daysAgo(1),brief:'Almonds, cashews, pistachios and raisins on a reusable brass thali with a hand-painted diya.'},
  {id:'p8',name:'Royal Velvet Gift Box',cat:'Gift boxes',section:'both',price:1199,mrp:1399,pack:'3 × 150 g',origin:'Assorted',art:'giftbox',stock:70,packedOn:daysAgo(1),brief:'Velvet box with three compartments. Note card included.'},
  {id:'p9',name:'Corporate Wooden Chest',cat:'Gift boxes',section:'corporate',price:1450,mrp:1700,pack:'4 × 150 g',origin:'Assorted',art:'chest',stock:500,packedOn:daysAgo(1),brief:'Sheesham wood chest. Your company logo can be laser-engraved on the lid.'},
  {id:'p10',name:'Executive Kaju-Badam Duo',cat:'Gift boxes',section:'corporate',price:799,mrp:950,pack:'2 × 200 g',origin:'Assorted',art:'giftbox2',stock:800,packedOn:daysAgo(2),brief:'Slim matte box that fits in a laptop bag. Popular for client meetings and Diwali staff gifts.'}
];
const DEFAULT_SETTINGS = {upiId:'shreeramtrading@okaxis',payee:'Shree Ram Trading Company',originPin:'110006',freeShipAbove:999,shipFee:79,adminPin:'1234',
  tiers:[{min:25,off:5},{min:100,off:10},{min:500,off:15}]};

let products = store.get('products', null) || SEED;
let settings = Object.assign({}, DEFAULT_SETTINGS, store.get('settings', {}));
let user = store.get('user', null);
let orders = store.get('orders', []);
const saveAll = () => { store.set('user',user); if(SERVER) return; store.set('products',products); store.set('settings',settings); store.set('orders',orders); };

/* ---------- live mode: talks to the shop server when one is present ---------- */
let SERVER = null, adminToken = null, adminOrders = [];
let myOrders = store.get('myorders', []); // [{id, token}] receipts this phone can open
async function apiCall(method, url, body){
  const r = await fetch(url, {method, cache:'no-store', headers:{'Content-Type':'application/json', ...(adminToken?{'X-Admin-Token':adminToken}:{})}, body: body ? JSON.stringify(body) : undefined});
  const j = await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(j.error || 'Something went wrong. Please try again.');
  return j;
}
async function boot(){
  try{ const r = await fetch('/api/config', {cache:'no-store'});
    if(r.ok){ const c = await r.json(); if(c.mode==='server'){ SERVER = c; settings = {...settings, ...c.settings}; products = await apiCall('GET','/api/products'); orders = []; if('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(()=>{}); } } }catch(e){}
  render();
}
async function load(r){
  try{
    const fetchMine = m => apiCall('GET', `/api/orders/${m.id}?t=${m.token}`).then(j=>j.order).catch(()=>null);
    if(r==='orders') orders = (await Promise.all(myOrders.map(fetchMine))).filter(Boolean);
    else if(r.startsWith('receipt:')){ const m = myOrders.find(x=>x.id===r.slice(8)); const o = m && await fetchMine(m); if(o) orders = [...orders.filter(x=>x.id!==o.id), o]; }
    else if(r==='admin' && adminToken && adminTab==='orders') adminOrders = await apiCall('GET','/api/admin/orders');
  }catch(e){ toast(e.message); }
}

const REGIONS = {1:'Delhi, Haryana, Punjab, HP, J&K',2:'Uttar Pradesh, Uttarakhand',3:'Rajasthan, Gujarat',4:'Maharashtra, MP, Chhattisgarh, Goa',5:'Andhra, Telangana, Karnataka',6:'Tamil Nadu, Kerala',7:'West Bengal, Odisha, North East',8:'Bihar, Jharkhand'};
const regionOf = pin => /^[1-8]\d{5}$/.test(pin) ? REGIONS[pin[0]] : null;

function addBusinessDays(date, n){ const d=new Date(date); let added=0; while(added<n){ d.setDate(d.getDate()+1); if(d.getDay()!==0) added++; } return d; }
function etaFor(pin, from=new Date()){
  const o = settings.originPin;
  let min, max;
  if(pin.slice(0,3)===o.slice(0,3)){min=1;max=1;}
  else if(pin[0]===o[0]){min=2;max=3;}
  else if(Math.abs(+pin[0]-+o[0])<=2){min=3;max=5;}
  else {min=4;max=6;}
  // order after 4 pm ships next day
  const start = from.getHours()>=16 ? addBusinessDays(from,1) : from;
  return {from:addBusinessDays(start,min).toISOString(), to:addBusinessDays(start,max).toISOString(), days:[min,max]};
}

function tierOff(qty){ let off=0; for(const t of settings.tiers) if(qty>=t.min) off=t.off; return off; }

/* ---------- product art (stand-in until the owner uploads photos) ---------- */
function rnd(seed){ let s=0; for(const c of seed) s=(s*31+c.charCodeAt(0))>>>0; return ()=>{ s=(s*1664525+1013904223)>>>0; return s/4294967296; }; }
const ARTS = {
  almond:{bg:'#E9D6B9',fill:'#A8683A',shape:'almond'}, cashew:{bg:'#EFE3C8',fill:'#E3C48E',shape:'cashew'},
  pista:{bg:'#DCE6C8',fill:'#C9B98F',shape:'pista'}, walnut:{bg:'#E6DCCB',fill:'#B88F5C',shape:'walnut'},
  raisin:{bg:'#E4D9D6',fill:'#3D2230',shape:'raisin'}, date:{bg:'#EAD8C5',fill:'#5A2E1A',shape:'date'},
  hamper:{bg:'#F1E2B8',fill:'#B8862B',shape:'hamper'}, giftbox:{bg:'#24402F',fill:'#7B1E3A',shape:'box'},
  chest:{bg:'#D9C3A2',fill:'#7A4E2A',shape:'chest'}, giftbox2:{bg:'#1F2A36',fill:'#C9A24D',shape:'box2'}
};
function art(p){
  const a = ARTS[p.art] || ARTS.almond, r = rnd(p.id+p.art);
  let s = `<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${esc(p.name)}"><rect width="200" height="200" fill="${a.bg}"/>`;
  const nut = (x,y,rot) => {
    switch(a.shape){
      case 'almond': return `<path transform="translate(${x} ${y}) rotate(${rot})" d="M0 -16 C11 -8 11 10 0 16 C-11 10 -11 -8 0 -16Z" fill="${a.fill}" stroke="#6E3F1F" stroke-width="1"/><path transform="translate(${x} ${y}) rotate(${rot})" d="M0 -12 L0 12" stroke="#7E4A26" stroke-width=".8" opacity=".6"/>`;
      case 'cashew': return `<path transform="translate(${x} ${y}) rotate(${rot})" d="M-12 -6 C-14 10 6 18 14 6 C9 8 2 6 -1 -2 C-3 -9 -9 -11 -12 -6Z" fill="${a.fill}" stroke="#B89559" stroke-width="1"/>`;
      case 'pista': return `<g transform="translate(${x} ${y}) rotate(${rot})"><ellipse rx="10" ry="14" fill="${a.fill}" stroke="#9E8D63"/><path d="M-4 -10 C0 -4 0 4 -4 10 C4 6 6 -6 -4 -10Z" fill="#7FA33A"/></g>`;
      case 'walnut': return `<g transform="translate(${x} ${y}) rotate(${rot})"><path d="M-14 0 C-14 -14 14 -14 14 0 C14 14 -14 14 -14 0Z" fill="${a.fill}" stroke="#8A6438"/><path d="M0 -10 C-6 -4 6 4 0 10 M-8 -4 C-4 0 -10 4 -6 8 M8 -4 C4 0 10 4 6 8" stroke="#7A5530" fill="none"/></g>`;
      case 'raisin': return `<ellipse cx="${x}" cy="${y}" rx="8" ry="6" transform="rotate(${rot} ${x} ${y})" fill="${a.fill}" stroke="#20121A"/>`;
      case 'date': return `<g transform="translate(${x} ${y}) rotate(${rot})"><ellipse rx="10" ry="18" fill="${a.fill}"/><path d="M-4 -12 C-6 0 -2 10 -4 14" stroke="#7A4428" fill="none"/></g>`;
    }
    return '';
  };
  if(['almond','cashew','pista','walnut','raisin','date'].includes(a.shape)){
    s += `<ellipse cx="100" cy="150" rx="78" ry="16" fill="#000" opacity=".08"/>`;
    const n = a.shape==='raisin'?60:a.shape==='date'?16:28;
    for(let i=0;i<n;i++){ const ang=r()*Math.PI*2, rad=Math.sqrt(r())*62; s+=nut(100+Math.cos(ang)*rad*1.15, 104+Math.sin(ang)*rad*.8, r()*360|0); }
  } else if(a.shape==='hamper'){
    s += `<ellipse cx="100" cy="112" rx="86" ry="62" fill="${a.fill}"/><ellipse cx="100" cy="108" rx="74" ry="50" fill="#D9AE5C"/>`;
    [['#A8683A',66,92],['#E3C48E',134,92],['#9DBB5A',66,128],['#3D2230',134,128]].forEach(([c,x,y])=>{ s+=`<circle cx="${x}" cy="${y}" r="20" fill="#F7EBD0"/><circle cx="${x}" cy="${y}" r="15" fill="${c}"/>`; });
    s += `<path d="M92 104 q8 -18 16 0 q-8 10 -16 0Z" fill="#E8892B"/><ellipse cx="100" cy="110" rx="12" ry="5" fill="#8A4B12"/>`;
  } else if(a.shape==='chest'){
    s += `<rect x="30" y="70" width="140" height="90" rx="8" fill="${a.fill}"/><path d="M30 78 Q100 30 170 78" fill="#8E5D33"/><rect x="30" y="96" width="140" height="6" fill="#5C3A1D"/><rect x="88" y="92" width="24" height="22" rx="3" fill="#C9A24D"/><text x="100" y="140" text-anchor="middle" font-family="Georgia" font-size="12" fill="#F1E2B8" opacity=".85">YOUR LOGO</text>`;
  } else {
    s += `<rect x="40" y="60" width="120" height="100" rx="6" fill="${a.fill}"/><rect x="40" y="60" width="120" height="22" fill="#000" opacity=".15"/><rect x="94" y="60" width="12" height="100" fill="#C9A24D"/><rect x="40" y="104" width="120" height="12" fill="#C9A24D"/><path d="M100 60 c-24 -26 -40 -6 0 0 c24 -26 40 -6 0 0" fill="none" stroke="#C9A24D" stroke-width="6"/>`;
  }
  return s + '</svg>';
}

  <form class="form" id="editForm">
    <div class="photo-in"><div class="prev" id="e-prev">${pic(p)}</div><label class="f">Product photo<input id="e-img" type="file" accept="image/*"><span class="hint">A square photo on a plain background looks best.</span></label></div>
    <label class="f">Product name<input id="e-name" required value="${esc(p.name)}"></label>
    <label class="f">Product brief<textarea id="e-brief">${esc(p.brief)}</textarea></label>
    <div class="row2"><label class="f">Selling price (₹)<input id="e-price" required inputmode="numeric" value="${p.price}"></label><label class="f">MRP (₹)<input id="e-mrp" inputmode="numeric" value="${p.mrp}"></label></div>
    <div class="row2"><label class="f">Package quantity<input id="e-pack" required placeholder="500 g" value="${esc(p.pack)}"></label><label class="f">Stock<input id="e-stock" inputmode="numeric" value="${p.stock}"></label></div>
    <div class="row2"><label class="f">Category<select id="e-cat">${['Dry fruits','Gift boxes','Festive hampers'].map(c=>`<option ${p.cat===c?'selected':''}>${c}</option>`).join('')}</select></label>
    <label class="f">Show in<select id="e-sec"><option value="both" ${p.section==='both'?'selected':''}>Both sections</option><option value="individual" ${p.section==='individual'?'selected':''}>Individual only</option><option value="corporate" ${p.section==='corporate'?'selected':''}>Corporate only</option></select></label></div>
    <div class="row2"><label class="f">Origin<input id="e-origin" value="${esc(p.origin)}"></label><label class="f">Packed on<input id="e-packed" type="date" value="${esc(p.packedOn)}"></label></div>
    <div class="err" id="e-err"></div>
    <div class="buybar">${id!=='new'?`<button type="button" class="btn ghost" data-del="${p.id}">Delete</button>`:'<span></span>'}<button class="btn">Save product</button></div>
  </form>`);
  let img = p.img || null;
  $('#e-img').onchange = e => { const f=e.target.files[0]; if(!f) return; shrink(f, url=>{ img=url; $('#e-prev').innerHTML=`<img src="${url}" alt="">`; }); };
  $('#editForm').onsubmit = async e => { e.preventDefault();
    const np = {...p, img, name:$('#e-name').value.trim(), brief:$('#e-brief').value.trim(), price:+$('#e-price').value, mrp:+$('#e-mrp').value||+$('#e-price').value, pack:$('#e-pack').value.trim(), stock:+$('#e-stock').value||0, cat:$('#e-cat').value, section:$('#e-sec').value, origin:$('#e-origin').value.trim(), packedOn:$('#e-packed').value};
    if(!np.name||!np.price||!np.pack){ $('#e-err').textContent='Add a name, a price and the package quantity.'; return; }
    if(SERVER){ try{ Object.assign(np, await apiCall('PUT','/api/admin/products/'+np.id, np)); }catch(err){ $('#e-err').textContent = err.message; return; } }
    const i = products.findIndex(x=>x.id===p.id); if(i>=0) products[i]=np; else products.push(np);
    saveAll(); closeSheet(); render(); toast('Product saved');
  };
  const del = document.querySelector('[data-del]');
  if(del) del.onclick = async () => { if(del.dataset.sure){ if(SERVER){ try{ await apiCall('DELETE','/api/admin/products/'+p.id); }catch(err){ toast(err.message); return; } } products = products.filter(x=>x.id!==p.id); saveAll(); closeSheet(); render(); toast('Product deleted'); } else { del.dataset.sure=1; del.textContent='Tap again to delete'; } };
}
function shrink(file, cb){ const r=new FileReader(); r.onload=()=>{ const im=new Image(); im.onload=()=>{ const s=Math.min(1,700/Math.max(im.width,im.height)); const c=document.createElement('canvas'); c.width=im.width*s; c.height=im.height*s; c.getContext('2d').drawImage(im,0,0,c.width,c.height); cb(c.toDataURL('image/jpeg',.82)); }; im.src=r.result; }; r.readAsDataURL(file); }

/* ---------- sheets ---------- */
function openSheet(html){ $('#layer').innerHTML = `<div class="scrim" id="scrim"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`; document.body.style.overflow='hidden';
  $('#scrim').onclick = e => { if(e.target.id==='scrim') closeSheet(); };
  document.querySelectorAll('[data-close]').forEach(b=>b.onclick=closeSheet); }
function closeSheet(){ $('#layer').innerHTML=''; document.body.style.overflow=''; }
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeSheet(); });

let pending = null; // {pid, qty, corp, gift}
function productSheet(pid, corp){
  const p = products.find(x=>x.id===pid);
  let qty = corp ? Math.max(25, settings.tiers[0].min) : 1;
  openSheet(`<div class="sheet-h"><h3>${esc(p.name)}</h3><button class="x" data-close aria-label="Close">×</button></div>
    <div class="pd-pic">${pic(p)}</div>
    <p style="margin:0">${esc(p.brief)}</p>
    <div class="facts"><div><small>Pack</small><b>${esc(p.pack)}</b></div><div><small>Origin</small><b>${esc(p.origin||'—')}</b></div><div><small>Packed on</small><b>${p.packedOn?new Date(p.packedOn).toLocaleDateString('en-IN',{day:'numeric',month:'short'}):'—'}</b></div></div>
    <div class="price num" style="padding:0"><b style="font-size:24px">${inr(p.price)}</b>${p.mrp>p.price?`<s>${inr(p.mrp)}</s>`:''}<span class="note">per pack, incl. GST</span></div>
    <div class="buybar"><div class="qty"><button type="button" data-q="-1" aria-label="Fewer">−</button><input id="qty" class="num" inputmode="numeric" value="${qty}" aria-label="Quantity"><button type="button" data-q="1" aria-label="More">+</button></div><div class="num" id="sub" style="font-weight:700;font-size:18px"></div></div>
    <div id="tierhint"></div>
    ${!corp?`<label class="check" style="margin-top:12px"><input type="checkbox" id="giftOn"> <span>This is a gift. Add a note card and hide prices on the packing slip.</span></label><textarea id="giftMsg" placeholder="Happy Diwali! With love, the Sharmas" hidden style="margin-top:8px"></textarea>`:''}
    <button class="btn block" style="margin-top:14px" id="buyNow">Buy now</button>
    <p class="note" id="etaHint" style="text-align:center;margin:8px 0 0"></p>`);
  const upd = () => { qty = Math.max(1, Math.min(9999, parseInt($('#qty').value)||1));
    const off = corp ? tierOff(qty) : 0, sub = p.price*qty*(1-off/100);
    $('#sub').textContent = inr(sub);
    if(corp){ const next = settings.tiers.find(t=>qty<t.min); $('#tierhint').innerHTML = `<div class="tierhint">${off?`<b>${off}% bulk discount applied.</b> `:''}${next?`Order ${next.min-qty} more to get ${next.off}% off.`:'You have the best bulk rate.'}</div>`; }
  };
  document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{ $('#qty').value = Math.max(1,(parseInt($('#qty').value)||1)+ +b.dataset.q*(corp?5:1)); upd(); });
  $('#qty').oninput = upd; upd();
  if(user){ const e = etaFor(user.pin); $('#etaHint').textContent = `Delivers to ${user.pin} by ${fmtDate(new Date(e.to))}`; }
  const g = $('#giftOn'); if(g) g.onchange = () => { $('#giftMsg').hidden = !g.checked; };
  $('#buyNow').onclick = () => {
    upd();
    pending = {pid, qty, corp, gift: g && g.checked ? {msg:$('#giftMsg').value.trim(), hidePrice:true} : null};
    if(!user || (corp && !user.company)) loginSheet(corp); else confirmSheet();
  };
}

function loginSheet(corp){
  const u = user || {};
  openSheet(`<div class="sheet-h"><h3>${user?'Your details':'Log in to buy'}</h3><button class="x" data-close aria-label="Close">×</button></div>
  <p class="note" style="margin-top:0">We use these to deliver your order and send the receipt.</p>
  <form class="form" id="loginForm" novalidate>
    <label class="f">Full name<input id="l-name" autocomplete="name" value="${esc(u.name)}"></label>
    <div class="row2"><label class="f">Phone number<input id="l-phone" inputmode="numeric" maxlength="10" autocomplete="tel-national" placeholder="10 digits" value="${esc(u.phone)}"></label>
    <label class="f">Email<input id="l-email" type="email" autocomplete="email" value="${esc(u.email)}"></label></div>
    <label class="f">Delivery address<textarea id="l-addr" autocomplete="street-address" placeholder="House no., street, area, city">${esc(u.address)}</textarea></label>
    <label class="f">Pincode<input id="l-pin" inputmode="numeric" maxlength="6" autocomplete="postal-code" value="${esc(u.pin)}"><span class="hint" id="l-region"></span></label>
    ${corp||u.company?`<div class="row2"><label class="f">Company name<input id="l-co" autocomplete="organization" value="${esc(u.company)}"></label><label class="f">GSTIN <span class="hint">optional</span><input id="l-gst" maxlength="15" value="${esc(u.gstin)}" style="text-transform:uppercase"></label></div>`:''}
    <div class="err" id="l-err"></div>
    <button class="btn block">${pending?'Continue to order':'Save details'}</button>
  </form>`);
  const showReg = () => { const v=$('#l-pin').value, r=regionOf(v); $('#l-region').textContent = r ? `Delivering to ${r}. About ${etaFor(v).days.join('–')} working days.` : (v.length===6?'We could not recognise this pincode.':''); };
  $('#l-pin').oninput = showReg; showReg();
  $('#loginForm').onsubmit = e => { e.preventDefault();
    const nu = {name:$('#l-name').value.trim(), phone:$('#l-phone').value.replace(/\D/g,''), email:$('#l-email').value.trim(), address:$('#l-addr').value.trim(), pin:$('#l-pin').value.trim()};
    if($('#l-co')){ nu.company=$('#l-co').value.trim(); nu.gstin=$('#l-gst').value.trim().toUpperCase(); }
    const err = !nu.name?'Enter your full name.':!/^[6-9]\d{9}$/.test(nu.phone)?'Enter a 10-digit mobile number starting with 6, 7, 8 or 9.':!/^\S+@\S+\.\S+$/.test(nu.email)?'Enter a valid email address.':nu.address.length<10?'Enter the full delivery address.':!regionOf(nu.pin)?'Enter a valid 6-digit pincode.':(corp&&!nu.company)?'Enter your company name.':(nu.gstin&&!/^\d{2}[A-Z]{5}\d{4}[A-Z][A-Z\d]Z[A-Z\d]$/.test(nu.gstin))?'That GSTIN looks wrong. It has 15 characters, like 07AABCS1234F1Z5.':'';
    if(err){ $('#l-err').textContent = err; return; }
    user = {...user, ...nu}; saveAll(); render();
    if(pending) confirmSheet(); else { closeSheet(); toast('Details saved'); }
  };
}

function priceFor(pd){ const p = products.find(x=>x.id===pd.pid); const gross = p.price*pd.qty; const off = pd.corp?tierOff(pd.qty):0; const discount = Math.round(gross*off/100); const net = gross-discount; const shipping = pd.corp||net>=settings.freeShipAbove?0:settings.shipFee; return {p,gross,off,discount,shipping,total:net+shipping}; }

function confirmSheet(){
  const c = priceFor(pending), eta = etaFor(user.pin);
  openSheet(`<div class="sheet-h"><h3>Confirm your order</h3><button class="x" data-close aria-label="Close">×</button></div>
    <dl class="kv"><dt>Customer</dt><dd>${esc(user.name)}${pending.corp&&user.company?'<br>'+esc(user.company):''}</dd><dt>Phone</dt><dd class="num">+91 ${esc(user.phone)}</dd><dt>Address</dt><dd>${esc(user.address)}, ${esc(user.pin)}</dd></dl>
    <button class="btn ghost small" data-editaddr style="margin-top:8px">Change details</button>
    <div class="lines num"><div class="line"><span>${esc(c.p.name)} (${esc(c.p.pack)}) × ${pending.qty}</span><span>${inr(c.gross)}</span></div>
    ${c.discount?`<div class="line"><span>Bulk discount (${c.off}%)</span><span>− ${inr(c.discount)}</span></div>`:''}
    <div class="line"><span>Delivery</span><span>${c.shipping?inr(c.shipping):'Free'}</span></div></div>
    <div class="line total num"><span>To pay</span><span>${inr(c.total)}</span></div>
    <p class="note">Estimated delivery ${fmtDate(new Date(eta.from))}${eta.from!==eta.to?' – '+fmtDate(new Date(eta.to)):''}</p>
    <button class="btn block" id="payNow" style="margin-top:6px">Pay now ${inr(c.total)}</button>
    <div class="payapps"><span>Google Pay</span><span>PhonePe</span><span>Paytm</span><span>BHIM</span><span>Any UPI app</span></div>`);
  document.querySelector('[data-editaddr]').onclick = () => loginSheet(pending.corp);
  $('#payNow').onclick = SERVER ? gatewayPay : paySheet;
}

function paySheet(){
  const c = priceFor(pending);
  const id = 'SRT' + Date.now().toString().slice(-8);
  const link = `upi://pay?pa=${encodeURIComponent(settings.upiId)}&pn=${encodeURIComponent(settings.payee)}&am=${c.total.toFixed(2)}&cu=INR&tn=${encodeURIComponent('Order '+id)}&tr=${id}`;
  openSheet(`<div class="sheet-h"><h3>Pay ${inr(c.total)} by UPI</h3><button class="x" data-close aria-label="Close">×</button></div>
    <a class="btn block" href="${link}" id="openUpi">Open my UPI app</a>
    <p class="note" style="text-align:center">On a phone this opens Google Pay, PhonePe, Paytm or your bank app with the amount filled in. On a computer, scan the code.</p>
    <div class="qrbox"><div id="qr"></div><small>Scan with any UPI app</small></div>
    <div class="upi-id"><span>UPI ID</span><code id="upiCode">${esc(settings.upiId)}</code><button class="btn ghost small" id="copyUpi">Copy</button></div>
    <form class="form" id="paidForm" style="margin-top:14px">
      <label class="f">UPI reference number <span class="hint">optional · the 12-digit UTR shown after payment</span><input id="utr" inputmode="numeric" maxlength="12"></label>
      <button class="btn brass block">I have paid</button>
    </form>`);
  const drawQr = lvl => { $('#qr').innerHTML=''; new QRCode($('#qr'), {text:link, width:180, height:180, correctLevel:QRCode.CorrectLevel[lvl]}); };
  try{ drawQr('M'); }catch(e){ try{ drawQr('L'); }catch(e2){ $('#qr').textContent = 'QR unavailable. Use the UPI ID below.'; } }
  $('#copyUpi').onclick = () => { navigator.clipboard?.writeText(settings.upiId).then(()=>toast('UPI ID copied')).catch(()=>{ const r=document.createRange(); r.selectNodeContents($('#upiCode')); getSelection().removeAllRanges(); getSelection().addRange(r); }); };
  $('#paidForm').onsubmit = e => { e.preventDefault();
    const utr = $('#utr').value.replace(/\D/g,'');
    const o = {id, createdAt:new Date().toISOString(), customer:{...user}, section:pending.corp?'corporate':'individual',
      items:[{pid:c.p.id,name:c.p.name,pack:c.p.pack,price:c.p.price,qty:pending.qty}], off:c.off, discount:c.discount, shipping:c.shipping, total:c.total,
      gift:pending.gift, utr, status: utr.length===12 ? 'paid' : 'pending', eta:etaFor(user.pin)};
    orders.push(o); c.p.stock = Math.max(0, c.p.stock - pending.qty); pending=null; saveAll(); closeSheet(); go('receipt:'+id); toast('Order placed');
  };
}

async function gatewayPay(){
  const btn = $('#payNow'); btn.disabled = true; btn.textContent = 'Starting payment…';
  const reset = label => { btn.disabled = false; btn.textContent = label; };
  try{
    const r = await apiCall('POST','/api/orders',{pid:pending.pid, qty:pending.qty, corp:pending.corp, gift:pending.gift, customer:user});
    myOrders.push({id:r.order.id, token:r.token}); store.set('myorders', myOrders);
    const done = async resp => {
      let msg = 'Payment received';
      try{ await apiCall('POST', `/api/orders/${r.order.id}/verify`, resp); }catch(err){ msg = err.message; }
      pending = null; closeSheet(); await go('receipt:'+r.order.id); toast(msg);
    };
    if(SERVER.gateway==='mock'){
      openSheet(`<div class="sheet-h"><h3>Test payment</h3><button class="x" data-close aria-label="Close">×</button></div><p class="note">Test mode stands in for the Razorpay window. No money moves.</p><button class="btn block" id="mockPay">Pay ${inr(r.order.total)} (test)</button>`);
      $('#mockPay').onclick = async () => done(await apiCall('POST','/api/mock/pay',{orderId:r.razorpay.orderId}));
      return;
    }
    if(!window.Razorpay) await loadScript('https://checkout.razorpay.com/v1/checkout.js');
    const rz = new Razorpay({key:r.razorpay.keyId, amount:r.razorpay.amount, currency:'INR', name:r.razorpay.name, description:'Order '+r.order.id,
      order_id:r.razorpay.orderId, prefill:{name:user.name, email:user.email, contact:'+91'+user.phone}, notes:{shop_order:r.order.id},
      theme:{color:'#1F5A3E'}, handler:done, modal:{ondismiss:()=>{ reset('Pay now'); toast('Payment cancelled. You can try again.'); }}});
    rz.on('payment.failed', e => toast((e.error && e.error.description) || 'Payment failed. Try another UPI app.'));
    rz.open();
  }catch(err){ reset('Try again'); toast(err.message); }
}

function quoteSheet(){
  openSheet(`<div class="sheet-h"><h3>Custom corporate quote</h3><button class="x" data-close aria-label="Close">×</button></div>
  <form class="form" id="quoteForm"><div class="row2"><label class="f">Company<input id="q-co" value="${esc(user?.company)}"></label><label class="f">Contact person<input id="q-name" value="${esc(user?.name)}"></label></div>
  <div class="row2"><label class="f">Phone<input id="q-phone" inputmode="numeric" maxlength="10" value="${esc(user?.phone)}"></label><label class="f">Number of gifts<input id="q-qty" inputmode="numeric" placeholder="e.g. 750"></label></div>
  <div class="row2"><label class="f">Budget per gift (₹)<input id="q-budget" inputmode="numeric" placeholder="e.g. 1200"></label><label class="f">Needed by<input id="q-date" type="date"></label></div>
  <label class="check"><input type="checkbox" id="q-logo"> <span>Add our logo to the box</span></label>
  <label class="check"><input type="checkbox" id="q-multi"> <span>Ship to many addresses (we will share a spreadsheet)</span></label>
  <label class="f">Anything else<textarea id="q-note" placeholder="Mix of items, dietary needs, branding colours"></textarea></label>
  <div class="err" id="q-err"></div><button class="btn block">Send request</button></form>`);
  $('#quoteForm').onsubmit = async e => { e.preventDefault(); if(!$('#q-co').value.trim()||!/^\d{10}$/.test($('#q-phone').value)){ $('#q-err').textContent='Add your company name and a 10-digit phone number.'; return; }
    const qd = {co:$('#q-co').value,name:$('#q-name').value,phone:$('#q-phone').value,qty:$('#q-qty').value,budget:$('#q-budget').value,date:$('#q-date').value,logo:$('#q-logo').checked,multi:$('#q-multi').checked,note:$('#q-note').value,at:new Date().toISOString()};
    if(SERVER){ try{ await apiCall('POST','/api/quotes',qd); }catch(err){ $('#q-err').textContent=err.message; return; } } else { const q = store.get('quotes',[]); q.push(qd); store.set('quotes',q); }
    closeSheet(); toast('Request saved. The owner will call you back.'); };
}

/* ---------- event binding ---------- */
function bind(){
  document.querySelectorAll('#app [data-nav]').forEach(b=>b.onclick=()=>go(b.dataset.nav));
  document.querySelectorAll('[data-nav2]').forEach(b=>b.onclick=()=>go(b.dataset.nav2));
  document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{ filter=b.dataset.filter; render(); });
  document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>productSheet(b.dataset.open, b.dataset.corp==='1'));
  document.querySelectorAll('[data-receipt]').forEach(b=>b.onclick=()=>go('receipt:'+b.dataset.receipt));
  document.querySelectorAll('[data-login]').forEach(b=>b.onclick=()=>{ pending=null; loginSheet(route==='corporate'); });
  document.querySelectorAll('[data-logout]').forEach(b=>b.onclick=()=>{ user=null; saveAll(); render(); toast('Logged out'); });
  document.querySelectorAll('[data-admin]').forEach(b=>b.onclick=()=>go('admin'));
  document.querySelectorAll('[data-quote]').forEach(b=>b.onclick=quoteSheet);
  document.querySelectorAll('[data-atab]').forEach(b=>b.onclick=()=>{ adminTab=b.dataset.atab; go('admin'); });
  document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>editSheet(b.dataset.edit));
  document.querySelectorAll('[data-lock]').forEach(b=>b.onclick=()=>{ adminOK=false; adminToken=null; go('account'); });
  document.querySelectorAll('[data-status]').forEach(s=>s.onchange=async ()=>{ const list = SERVER?adminOrders:orders; const o=list.find(x=>x.id===s.dataset.status);
    if(SERVER){ try{ await apiCall('PATCH','/api/admin/orders/'+o.id,{status:s.value}); }catch(err){ toast(err.message); render(); return; } }
    o.status=s.value; saveAll(); toast('Status updated'); render(); });
  document.querySelectorAll('[data-reset]').forEach(b=>b.onclick=()=>{ if(b.dataset.sure){ products=SEED.map(p=>({...p})); settings={...DEFAULT_SETTINGS}; orders=[]; saveAll(); render(); toast('Example data restored'); } else { b.dataset.sure=1; b.textContent='Tap again to erase products and orders'; } });
  const al = $('#adminLogin'); if(al) al.onsubmit = async e => { e.preventDefault();
    if(SERVER){ try{ adminToken = (await apiCall('POST','/api/admin/login',{pin:$('#apin').value})).token; adminOK=true; go('admin'); }catch(err){ $('#aerr').textContent=err.message; } return; }
    if($('#apin').value===settings.adminPin){ adminOK=true; render(); } else $('#aerr').textContent='That PIN is not right.'; };
  const sf = $('#settingsForm'); if(sf) sf.onsubmit = async e => { e.preventDefault();
    const pin=$('#s-pin').value.trim(); if(!regionOf(pin)){ toast('Enter a valid 6-digit shop pincode'); return; }
    const next = {...settings, upiId:$('#s-upi')?$('#s-upi').value.trim():settings.upiId, payee:$('#s-payee').value.trim(), originPin:pin, freeShipAbove:+$('#s-free').value||0,
      tiers: settings.tiers.map((t,i)=>({min:+$('#t-min-'+i).value||t.min, off:+$('#t-off-'+i).value||0})).sort((a,b)=>a.min-b.min)};
    if(SERVER){ try{ Object.assign(next, await apiCall('PUT','/api/admin/settings', next)); }catch(err){ toast(err.message); return; } }
    settings = next; saveAll(); toast('Settings saved'); render(); };
}
boot();
</script>
