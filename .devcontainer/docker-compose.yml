# GitHub Codespaces: the app container plus its own Postgres database.
services:
  app:
    image: mcr.microsoft.com/devcontainers/javascript-node:1-22-bookworm
    volumes:
      - ../..:/workspaces:cached
    command: sleep infinity
    network_mode: service:db

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: srt
      POSTGRES_PASSWORD: srt
      POSTGRES_DB: srt_dev
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
