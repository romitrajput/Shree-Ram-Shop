# Runs on every pull request and push: nothing reaches test or production unless this passes.
name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: srt
          POSTGRES_PASSWORD: srt
          POSTGRES_DB: srt_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U srt" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://srt:srt@localhost:5432/srt_ci?schema=public
      AUTH_SECRET: ci-only-secret-that-is-long-enough-123456
      APP_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate schema
        run: npx prisma validate
      - name: Apply migrations to a fresh database
        run: npx prisma migrate deploy
      - name: Fail if schema.prisma has changes without a migration
        run: npx prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code
      - name: Seed (proves the seed still works)
        run: npm run db:seed
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  # Runs the Playwright tests against a real build with a seeded database
  e2e:
    needs: check
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: srt
          POSTGRES_PASSWORD: srt
          POSTGRES_DB: srt_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U srt" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://srt:srt@localhost:5432/srt_e2e?schema=public
      AUTH_SECRET: ci-only-secret-that-is-long-enough-123456
      APP_ENV: test
      UPLOAD_DIR: /tmp/uploads
      ADMIN_EMAIL: owner@shreeramtrading.in
      ADMIN_PASSWORD: e2e-owner-password
      E2E_ADMIN_EMAIL: owner@shreeramtrading.in
      E2E_ADMIN_PASSWORD: e2e-owner-password
      RATE_LIMIT_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run db:seed
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Seed a payment waiting for verification (so the admin test has one)
        run: npm run test:e2e -- --project=desktop -g "customer places an order"
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
