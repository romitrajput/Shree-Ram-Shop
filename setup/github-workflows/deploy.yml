# Release pipeline
#
#   push to `develop`  ──► build image ──► deploy to TEST (automatic)
#                                              │
#                         owner reviews test.shreeramtrading.in
#                                              │
#                         owner clicks "Approve and deploy" in GitHub
#                                              ▼
#                                      deploy the SAME image to PRODUCTION
#                                      + tag the release + update `main`
#
# The approval gate is the GitHub Environment "production" with the owner as a
# required reviewer (Settings → Environments). See docs/RELEASE_PROCESS.md.

name: Deploy

on:
  push:
    branches: [develop]
  workflow_dispatch:
    inputs:
      environment:
        description: "Where to deploy (use for rollbacks)"
        type: choice
        options: [test, production]
        required: true
      tag:
        description: "Image tag to deploy, e.g. sha-1a2b3c4 (see Packages or past runs)"
        required: true

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/shree-ram-trading

jobs:
  build:
    # Switched off until a server exists: set repository variable DEPLOY_ENABLED=true
    if: github.event_name == 'push' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: echo "tag=sha-$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: APP_VERSION=${{ github.sha }}
          tags: ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-test:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: test
      url: https://${{ vars.TEST_DOMAIN }}
    steps:
      - name: Deploy to test server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: cd /opt/srt && ./deploy.sh test ${{ needs.build.outputs.tag }}
      - name: Smoke test
        run: |
          sleep 5
          curl -fsS "https://${{ vars.TEST_DOMAIN }}/api/health" | tee /dev/stderr | grep -q '"status":"ok"'

  # Waits here until the owner approves in GitHub ("Review deployments").
  deploy-production:
    needs: [build, deploy-test]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://${{ vars.PROD_DOMAIN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Deploy approved image to production
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: cd /opt/srt && ./deploy.sh prod ${{ needs.build.outputs.tag }}
      - name: Smoke test
        run: |
          sleep 5
          curl -fsS "https://${{ vars.PROD_DOMAIN }}/api/health" | grep -q '"status":"ok"'
      - name: Tag release and move main to what is live
        run: |
          git config user.name "release-bot"
          git config user.email "release-bot@users.noreply.github.com"
          TAG="release-$(date +%Y%m%d-%H%M)-${{ needs.build.outputs.tag }}"
          git tag "$TAG" "$GITHUB_SHA"
          git push origin "$TAG"
          git push origin "$GITHUB_SHA:refs/heads/main" --force-with-lease

  # Manual deploy of any existing image, mainly to roll back.
  manual:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
    steps:
      - uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: cd /opt/srt && ./deploy.sh ${{ inputs.environment == 'production' && 'prod' || 'test' }} ${{ inputs.tag }}
